<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents — Shibam Coffee Atlanta</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/team/css/styles.css?v=6">

<body data-page="app" data-require-role="barista">

  <header class="portal-header">
    <div class="container portal-header__inner">
      <div class="portal-header__brand">
        Shibam Coffee
        <span>Team Forms</span>
      </div>
      <div class="portal-header__session">

      <div class="portal-intro">
        <h1>Documents</h1>
        <p>Employee handbook and other company guidelines. These stay live in Google Drive — this page just gives you a quick way to open them.</p>

      <div id="documents-list"></div>

    </div>
  </main>

  <footer class="portal-footer">
    <div class="container">
      <p>&copy; <span id="footer-year">2026</span> Yemeni Coffee Co. DBA Shibam Coffee — internal use only.</p>
    </div>
