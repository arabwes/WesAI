<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Accept Team Invitation — Shibam Coffee</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/team/css/styles.css"><script src="/team/js/config.js" defer></script><script src="/team/js/auth.js" defer></script><script src="/team/js/accept-invitation.js" defer></script></head>
<body><main class="portal-main"><div class="container"><section class="schedule-section invitation-card"><span class="schedule-eyebrow">Shibam Coffee team portal</span><h1>Create your account</h1><p id="invitation-summary">Checking invitation…</p><form id="invitation-form" class="portal-form" hidden><div class="form-group"><label for="invite-username">Username</label><input id="invite-username" name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" required></div><div class="form-group"><label for="invite-password">Password</label><input id="invite-password" name="password" type="password" minlength="10" required></div><div class="form-group"><label for="invite-confirm">Confirm password</label><input id="invite-confirm" name="confirm" type="password" minlength="10" required></div><button class="btn btn-primary" type="submit">Create account</button><p class="form-status" data-form-status></p></form></section></div></main></body></html>
