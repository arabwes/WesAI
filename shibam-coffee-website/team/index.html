<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Login — Shibam Coffee Atlanta</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/team/app.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/team/css/styles.css?v=10">
  <script src="/team/js/config.js?v=10" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script src="/team/js/auth.js?v=10" defer></script>
</head>
<body data-page="login">

  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        Shibam Coffee
        <span>Team Portal</span>
      </div>

      <form id="login-form" class="portal-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div id="turnstile-widget" hidden></div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </div>
      </form>

      <p class="login-help">Lost your login? Ask a manager to reset it from the Admin dashboard.</p>
    </div>
  </main>

</body>
</html>
