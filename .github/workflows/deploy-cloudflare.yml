name: Deploy to Cloudflare

# Runs by itself whenever a push to main changes the database (migrations) or the
# notification Worker. Pushes that only change website pages do not run it: the website
# publishes itself from main through Cloudflare Pages.
#
# What an automatic run does, in order:
#   1. tests (stops here if anything fails; nothing on Cloudflare is touched)
#   2. a 30 second countdown. To stop the deploy, open the run and click "Cancel workflow".
#   3. saves a database restore point (Cloudflare Time Travel) and prints how to use it
#   4. applies pending database migrations
#   5. deploys the notification Worker
#   6. deploys the portal AI connector (portal-mcp), once the PORTAL_MCP_ENABLED repository
#      variable is "true" (it needs two extra Cloudflare token permissions; see its README)
#   7. checks the live booking page and API (and the connector, when enabled)
#
# Manual runs (Actions tab, "Run workflow") are still available:
#   check  (default): changes NOTHING. Shows what is pending.
#   deploy:           the same steps as an automatic run, without the countdown.

on:
  push:
    branches: [main]
    paths:
      - "shibam-coffee-website/migrations/**"
      - "shibam-coffee-website/workers/notifications/**"
      # The portal AI connector bundles the portal's own code (and the notification Worker imports
      # calendar-retention.js), so any change here must redeploy them to keep the rules identical.
      - "shibam-coffee-website/functions/_lib/**"
      - "shibam-coffee-website/workers/portal-mcp/**"
      - "shibam-coffee-website/package.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = look only, deploy = apply migrations and deploy the Worker"
        type: choice
        options: [check, deploy]
        default: check

permissions:
  contents: read

# One deploy at a time. A run that has already started is never cancelled halfway
# (that could stop a database change midway); a newer push waits its turn.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  SITE_URL: https://shibamatlanta.com

jobs:
  cloudflare:
    name: ${{ inputs.mode || 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: shibam-coffee-website
    env:
      # Pushes have no input, so they always deploy; manual runs use the mode that was chosen.
      MODE: ${{ inputs.mode || 'deploy' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Checkout must come first: every run step below executes inside shibam-coffee-website/,
      # which does not exist until the repository has been downloaded.
      - uses: actions/checkout@v4

      - name: Check the Cloudflare secrets are set
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::The GitHub secret CLOUDFLARE_API_TOKEN is not set (repo Settings, Secrets and variables, Actions)."; missing=1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::The GitHub secret CLOUDFLARE_ACCOUNT_ID is not set (repo Settings, Secrets and variables, Actions)."; missing=1; fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shibam-coffee-website/package-lock.json
      - run: npm ci

      # Informational only: a token without the extra "read" permissions can still deploy,
      # so this must never block the real steps below.
      - name: Show which account the token belongs to
        continue-on-error: true
        run: npx wrangler whoami

      - name: Show pending database migrations
        run: npx wrangler d1 migrations list shibam-team --remote

      - name: Show whether the portal AI connector is switched on
        run: |
          if [ "${{ vars.PORTAL_MCP_ENABLED }}" = "true" ]; then echo "Portal AI connector: ON (deployed by this workflow)";
          else echo "Portal AI connector: OFF. To switch it on, follow shibam-coffee-website/workers/portal-mcp/README.md."; fi

      - name: Show the notification Worker's secret names
        run: |
          npx wrangler secret list --config workers/notifications/wrangler.jsonc | tee secrets.json
          if ! grep -q '"RESEND_API_KEY"' secrets.json; then
            echo "::warning::RESEND_API_KEY is not set on the notification Worker. Booking emails will not send until it is added."
          fi

      - name: Tests (deploy only)
        if: env.MODE == 'deploy'
        run: npm test

      # Only for automatic runs: a person who clicks "Run workflow" has already decided.
      - name: Pause 30 seconds before deploying (automatic runs only)
        if: env.MODE == 'deploy' && github.event_name == 'push'
        run: |
          echo "::notice title=Deploying in 30 seconds::To stop this deploy, cancel this run now (open the run, then Cancel workflow). Nothing has been changed yet."
          for left in 30 25 20 15 10 5; do
            echo "Deploying in $left seconds... (cancel this run to stop)"
            sleep 5
          done

      # Cloudflare keeps 30 days of database history. This records the exact moment before
      # any change so it can be restored if a database change turns out to be wrong.
      - name: Save a database restore point (deploy only)
        if: env.MODE == 'deploy'
        id: restore
        continue-on-error: true
        run: |
          npx wrangler d1 time-travel info shibam-team | tee restore-point.txt
          # Wrangler prints: The current bookmark is '<id>'
          bookmark="$(sed -n "s/.*current bookmark is '\([^']*\)'.*/\1/p" restore-point.txt | head -1)"
          if [ -z "$bookmark" ]; then
            echo "::warning::Could not read a restore point. The deploy will continue, but there is no saved restore point for this run."
            exit 0
          fi
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          {
            echo "### Database restore point"
            echo "Saved just before this deploy changed anything:"
            echo
            echo "    $bookmark"
            echo
            echo "To undo this deploy's database changes, run in the website folder:"
            echo
            echo "    npx wrangler d1 time-travel restore shibam-team --bookmark=$bookmark"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply database migrations (deploy only)
        if: env.MODE == 'deploy'
        run: npm run db:migrate:production

      - name: Deploy the notification Worker (deploy only)
        if: env.MODE == 'deploy'
        run: npm run notifications:deploy

      - name: Deploy the portal AI connector (deploy only, once enabled)
        if: env.MODE == 'deploy' && vars.PORTAL_MCP_ENABLED == 'true'
        working-directory: shibam-coffee-website/workers/portal-mcp
        run: |
          npm ci
          npx wrangler deploy

      - name: Confirm no migrations are left (deploy only)
        if: env.MODE == 'deploy'
        run: npx wrangler d1 migrations list shibam-team --remote

      - name: Check the live booking page and API (deploy only)
        if: env.MODE == 'deploy'
        env:
          CHECK_PORTAL_MCP: ${{ vars.PORTAL_MCP_ENABLED == 'true' && '1' || '0' }}
        run: ./scripts/verify-booking-live.sh "$SITE_URL"

      - name: Explain what to do if this run failed
        if: failure() && env.MODE == 'deploy'
        env:
          BOOKMARK: ${{ steps.restore.outputs.bookmark }}
        run: |
          {
            echo "### This deploy failed"
            echo "Open the red step above and read its message."
            echo
            echo "- If it failed at **Tests**, nothing on Cloudflare was changed."
            echo "- If it failed at **Apply database migrations**, the database may be partly updated. Do not run it again until you have looked at the message."
            echo "- If it failed at **Check the live booking page and API**, the changes were applied. The website may still be publishing; run the workflow again in a few minutes."
            if [ -n "$BOOKMARK" ]; then
              echo
              echo "To put the database back exactly as it was before this deploy:"
              echo
              echo "    npx wrangler d1 time-travel restore shibam-team --bookmark=$BOOKMARK"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
